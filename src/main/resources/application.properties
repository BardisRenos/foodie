# =====================
# App
# =====================
spring.application.name=foodie
server.port=8080

# =====================
# Active profile (dev uses H2, prod uses PostgreSQL)
# =====================
spring.profiles.active=@spring.profiles.active@

# =====================
# JPA / Hibernate
# =====================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Flyway off by default, enabled per profile
spring.flyway.enabled=false

jwt.secret=foodie-super-secret-key-must-be-at-least-256-bits-long
jwt.expiration=86400000

# =====================
# HikariCP Connection Pool
# =====================
spring.datasource.hikari.pool-name=FoodieHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

app.upload.dir=uploads
app.base-url=http://localhost:8080

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true